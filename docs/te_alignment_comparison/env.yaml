# Tools for the bowtie2 alignment mode comparison of the TE module (same
# versions as workflow/envs/encode.yaml and workflow/envs/te.yaml)
name: te_alignment_comparison
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - conda-forge::python=3.12
  - conda-forge::numpy=2.2
  - conda-forge::pandas=2.2
  - conda-forge::scipy=1.15
  - conda-forge::pigz=2.8
  - bioconda::sra-tools=3.1.1
  - bioconda::cutadapt=4.9
  - bioconda::bowtie2=2.5.4
  - bioconda::samtools=1.21
  - bioconda::pysam=0.23.3
  - bioconda::subread=2.1.1
