genome:
  ensembl: test
  release: 115

mito_chr_name: MT

cutadapt:
  adapter_r1: CTGTCTCTTATA
  adapter_r2: CTGTCTCTTATA
  extra: "-e 0.1 -m 5"

bowtie2:
  multimapping: 4
  extra: "-X2000 --mm"

filter:
  mapq_thresh: 30
  filter_chrs: ["MT"]

subsample_reads: min

macs2:
  # Test genome is human chr11 only
  gsize: "1.3e8"
  pval_thresh: 0.01
  smooth_win: 150
  cap_num_peak: 300000

peaks:
  keep_chr_regex: "[0-9]+|X|Y"
  # Peaks reproducible in at least this fraction of the replicates of a
  # condition (rounded up, at least 2; not part of the ENCODE pipeline):
  # results/{idr,overlap}/{condition}/replicated_peak.narrowPeak
  min_replicate_fraction: 1
  # A pooled peak is reproducible in a replicate if it overlaps a peak of the
  # replicate by at least this fraction (of either peak; ENCODE naive overlap:
  # 0.5). Used for results/overlap/{condition}/replicated_peak.narrowPeak and
  # the TE peaks
  min_overlap: 0.5
  # Promoter window (bp up- and downstream of the TSS) of the ChIPseeker
  # peak annotation (tssRegion)
  tss_region: 3000

idr:
  enable: true
  threshold: 0.05

pseudoreplication_random_seed: 0

# Comparison of all samples with DESeq2 (not part of the ENCODE pipeline):
# PCA, sample correlation and differential accessibility from Tn5 insertions
# in the consensus peaks
deseq2:
  enable: true
  # Optimal peak sets that are merged into the consensus peaks: overlap or idr
  peak_method: overlap
  # Number of most variable peaks used for the PCA
  pca_ntop: 500
  # Differential accessibility: [treatment, control] pairs of conditions; empty:
  # each condition with at least 2 replicates against the reference condition
  # (reference column of the sample sheet)
  contrasts: []
  # Adjusted p-value below which a peak is called differential
  fdr: 0.05
  # Test against this absolute log2 fold change (0: any change)
  lfc_threshold: 0
  # Peaks (and TE subfamilies) with fewer insertions in all samples together
  # are removed before the DESeq2 PCA, correlation and testing
  min_count: 10

# Transposable element (TE) module (not part of the ENCODE pipeline): counts
# Tn5 insertions in RepeatMasker repeats per subfamily, family and class,
# keeping multimapping reads that the ENCODE filter removes
te:
  enable: true
  # Run only the TE module (with the genome, index and read trimming it
  # needs), not the ENCODE peaks, signal tracks, QC and DESeq2 of the peaks
  only: false
  # RepeatMasker classes to count (empty list: all repeats)
  classes: ["LINE", "SINE", "LTR", "DNA", "Retroposon", "RC", "Satellite"]
  # Library size for the DESeq2 comparison of subfamilies (with deseq2:
  # enable): deseq2 (median-of-ratios over the subfamilies) or insertions
  # (all kept insertions of a sample, for when most repeats change)
  normalisation: deseq2
  # Bin size (bp) of the TE signal tracks (results/te/bigwig/)
  bigwig_bin_size: 10
  # Scaling of the TE signal tracks: cpm (per million kept insertions) or
  # deseq2 (DESeq2 size factors of the TE consensus peaks, needs deseq2:
  # enable); deseq2 here to test the size factors
  bigwig_normalisation: deseq2
  # Heatmap per DESeq2 contrast (results/te/deseq2/{contrast}/heatmap_classes.pdf),
  # faceted by class. Lists; ["all"] selects every class or subfamily
  heatmap:
    classes: ["LINE", "SINE", "LTR", "DNA"]
    # ["all"]: the significant subfamilies of these classes. Named subfamilies
    # (e.g. ["L1MdTf_I", "L1MdA_I", "IAPEz-int"]) are plotted whether
    # significant or not
    subfamilies: ["all"]
    # Most significant subfamilies per class (with subfamilies: ["all"])
    max_per_class: 25
  # Profile of Tn5 insertions over the full-length copies of repeats, scaled
  # to body_length bp with flank bp on each side (results/te/profile/), one
  # panel per entry of subfamilies. Full-length: a copy covers at least
  # min_consensus_fraction of its subfamily's RepeatMasker consensus.
  # An entry of subfamilies can be:
  #   - a subfamily (repName), e.g. "L1MdTf_I" or "IAPEz-int"
  #   - a prefix: all subfamilies named <prefix>_*, plotted together,
  #     e.g. "L1MdTf" for L1MdTf_I, L1MdTf_II and L1MdTf_III (only used if no
  #     subfamily has that exact name)
  #   - "family:<repFamily>": all subfamilies of a RepeatMasker family,
  #     e.g. "family:L1" for all LINE-1s, "family:ERVK"
  #   - "class:<repClass>": all subfamilies of a RepeatMasker class,
  #     e.g. "class:LINE", "class:LTR"
  # Use family: or class: for whole families, not a bare name: "L1" would be
  # read as a prefix and select only subfamilies named L1_* (e.g. L1_Mus1).
  # Families and classes mix old and young elements of different lengths, and
  # RepeatMasker annotates LTRs and internal parts (-int) separately, so
  # class:LTR is mostly solo LTRs. logs/te/te_full_length_copies.log lists the
  # subfamilies and copies of each entry. Empty list: no plot
  profile:
    subfamilies: ["L1HS", "L1PA2", "L1PA3", "SVA_D", "LTR12C"]
    min_consensus_fraction: 0.9
    flank: 2000
    body_length: 6000
  # Comparison of the differential TE peaks of each contrast (with deseq2:
  # enable) with other data sets, e.g. EM-seq DMRs: GAT enrichment against the
  # whole genome and area-proportional Venn diagrams
  # (results/te/correlation/). Name: BED file; empty: no comparison
  correlation:
    datasets:
      Promoters: config/correlation/promoters_chr11.bed
      Random regions: config/correlation/random_chr11.bed
    gat_samples: 10000

# Integration with RNA-seq (not part of the ENCODE pipeline; needs deseq2:
# enable): the differential accessibility of a contrast is compared with an
# RNA-seq DESeq2 results table of the same contrast (same treatment and
# control). Genes (non-TE rows) are compared with the consensus peaks
# (results/integration/rna-seq/{contrast}/) and, with the TE module (also
# with te: only), with the genome-wide peaks of the TE module
# (results/te/integration/rna-seq/{contrast}/genes/); repeat subfamilies (TE
# rows of the table, e.g. from TEtranscripts) with the subfamily counts and
# TE peaks (results/te/integration/rna-seq/{contrast}/subfamilies/)
rnaseq:
  # DESeq2 contrast name ({treatment}_vs_{control}): RNA-seq DESeq2 results
  # table (tab-separated, or .csv), or a list of tables (e.g. genes and TEs in
  # separate files); empty: no integration
  tables:
    ko_vs_wt: config/rnaseq/ko_vs_wt_deseq2.csv
  # Columns of the tables; gene_id "": the first column (e.g. the row names
  # written by write.csv(as.data.frame(res)))
  columns:
    gene_id: ""
    log2fc: log2FoldChange
    padj: padj
    base_mean: baseMean
  # Gene identifiers: ensembl (gene IDs, a version suffix is removed), symbol
  # (gene names) or auto (whichever matches more rows to the genome annotation)
  id_type: auto
  # TE module: rows whose ID, up to the first te_separator, is a RepeatMasker
  # subfamily are TEs, e.g. "L1MdTf_I:L1:LINE" (TEtranscripts) or "L1MdTf_I"
  te_separator: ":"
  # Genes (and subfamilies) with padj below fdr and |log2 fold change| above
  # lfc_threshold are up- or downregulated
  fdr: 0.05
  lfc_threshold: 0
  # Peaks are assigned to the gene of their nearest TSS, if it is within the
  # largest distance (bp); the enrichment and correlation are given per
  # distance bin (0-1 kb, 1-10 kb, ...) and for all distances
  distance_bins: [1000, 10000, 50000, 100000]
  # Peak-gene pairs with a significant change in both (padj below the fdr of
  # each data set) and |log2 fold change| above this in both: scatter and
  # distance plots (pairs.tsv)
  pair_lfc_threshold: 1
  # TE module: profile of the Tn5 insertions (CPM) around the TSS of the up-,
  # down- and unchanged genes, this many bp up- and downstream
  tss_profile_flank: 3000

# Integration with differential H3K9me3 (not part of the ENCODE pipeline;
# needs deseq2: enable): the differential accessibility of a contrast is
# compared with the H3K9me3 regions that change in the same contrast (e.g.
# CUT&RUN). Consensus peaks: results/integration/h3k9me3/{contrast}/; with the
# TE module (also with te: only), TE peaks, signal over the H3K9me3 regions
# and repeat subfamilies: results/te/integration/h3k9me3/{contrast}/
h3k9me3:
  # DESeq2 contrast name ({treatment}_vs_{control}): H3K9me3 data of the same
  # contrast; empty: no integration
  contrasts:
    ko_vs_wt:
      # Synthetic DiffBind table (ko_vs_wt_lost.bed: its lost sites, for a
      # run with diffbind: false)
      regions: config/h3k9me3/ko_vs_wt_diffbind.csv
      diffbind: true
      bigwigs:
        control: config/h3k9me3/wt_h3k9me3.bw
        treatment: config/h3k9me3/ko_h3k9me3.bw
  # contrasts:
  #   ko_vs_wt:
  #     # Differential H3K9me3 regions: a DiffBind results table, or a BED
  #     # file of regions that change in one direction (e.g. MACS2 peaks of
  #     # the control called with the treatment as control sample)
  #     regions: /path/to/ko_vs_wt_h3k9me3.bed
  #     # true: regions is a DiffBind results table (tab-separated, or .csv)
  #     # of all sites of this contrast, e.g. as.data.frame(dba.report(db,
  #     # contrast = 1, th = 1, precision = 0)), with log2 fold changes and
  #     # FDR; false: a BED file
  #     diffbind: false
  #     # BED file only: H3K9me3 in the regions is lost or gained in the
  #     # treatment
  #     direction: lost
  #     # Optional: H3K9me3 signal (BigWig) of the control and the treatment,
  #     # e.g. the mean of the replicates (deepTools bigwigAverage); profile
  #     # of the signal around the differential peaks
  #     bigwigs:
  #       control: /path/to/wt_h3k9me3.bw
  #       treatment: /path/to/ko_h3k9me3.bw
  # Columns of the DiffBind tables; log2fc: log2 fold change of the treatment
  # over the control (flip_fold: true if it is control over treatment)
  columns:
    chr: seqnames
    start: start
    end: end
    log2fc: Fold
    fdr: FDR
  flip_fold: false
  # DiffBind regions with FDR below fdr are lost (log2 fold change below 0)
  # or gained (above 0)
  fdr: 0.05
  # Profiles: flank (bp) around the ATAC-seq peak centres and the H3K9me3
  # regions; H3K9me3 regions are scaled to body_length bp (multiples of the
  # 50 bp bins, or of --binSize in extra: computematrix)
  profile_flank: 5000
  profile_body_length: 5000
  # TE module: subfamilies with at least this many copies in the genome are
  # compared (subfamilies/)
  min_copies: 20

# Integration with DNA methylation (not part of the ENCODE pipeline; needs
# deseq2: enable): as h3k9me3:, with the differentially methylated regions
# (DMRs) of the same contrast (e.g. EM-seq, bisulfite sequencing).
# Consensus peaks: results/integration/methylation/{contrast}/; with the TE
# module (also with te: only): results/te/integration/methylation/{contrast}/
methylation:
  # DESeq2 contrast name ({treatment}_vs_{control}): methylation data of the
  # same contrast; empty: no integration
  contrasts:
    ko_vs_wt:
      # Synthetic methylKit table (ko_vs_wt_hypo.bed: its hypomethylated
      # regions, for a run with methylkit: false)
      regions: config/methylation/ko_vs_wt_methylkit.csv
      methylkit: true
      bigwigs:
        control: config/methylation/wt_methylation.bw
        treatment: config/methylation/ko_methylation.bw
  # contrasts:
  #   ko_vs_wt:
  #     # DMRs: a methylKit results table of all tested regions, or a BED file
  #     # of DMRs of one direction (e.g. hypomethylated tiles, adjacent tiles
  #     # merged)
  #     regions: /path/to/ko_vs_wt_hypomethylated_dmrs.bed
  #     # true: regions is a methylKit table (tab-separated, or .csv) of all
  #     # tested regions, e.g. getData(calculateDiffMeth(...)), with the
  #     # methylation difference (percentage points) and q-value; false: a
  #     # BED file
  #     methylkit: false
  #     # BED file only: the DMRs are hypo- or hypermethylated in the
  #     # treatment
  #     direction: hypo
  #     # Optional: CpG methylation (%, BigWig) of the control and the
  #     # treatment; profile of the methylation around the differential peaks
  #     # and over the DMRs
  #     bigwigs:
  #       control: /path/to/wt_methylation.bw
  #       treatment: /path/to/ko_methylation.bw
  # Columns of the methylKit tables; diff: methylation difference of the
  # treatment minus the control (flip_diff: true if control minus treatment)
  columns:
    chr: chr
    start: start
    end: end
    diff: meth.diff
    fdr: qvalue
  flip_diff: false
  # Regions with q-value below fdr and |methylation difference| above
  # min_diff (percentage points) are hypo- (below 0) or hypermethylated
  fdr: 0.01
  min_diff: 25
  # Profiles (multiples of the 50 bp bins, or of --binSize in extra:
  # computematrix), and TE subfamilies with at least min_copies copies
  profile_flank: 5000
  profile_body_length: 5000
  min_copies: 20

# Integration of all data sets of a contrast (not part of the ENCODE
# pipeline; needs te: enable and deseq2: enable): for each contrast with an
# RNA-seq table (rnaseq: tables) and H3K9me3 and DNA methylation data with
# BigWig files (h3k9me3: and methylation: contrasts), the four data sets are
# compared per repeat subfamily (heatmap of the changes), per TE peak (UpSet
# plot, enrichment by combination of the marks) and per full-length copy of
# the te: profile: subfamilies entries (heatmap and profile of the signal)
# (results/te/integration/multiomics/{contrast}/)
multiomics:
  enable: true
  # Subfamilies with at least this many copies in the genome are in the
  # heatmap if their accessibility or expression changes significantly
  min_copies: 20
  # Most subfamilies in the heatmap (smallest adjusted p-value first); the
  # subfamilies of te: profile: subfamilies are always shown
  max_subfamilies: 60
  # Largest combinations of sets in the UpSet plot of the TE peaks
  max_combinations: 25

# Extra command-line arguments of tools that are run directly as a command,
# appended to the workflow's own options ("": none). Tools run from the
# workflow's scripts (e.g. MACS2, IDR, plotFingerprint) are not included;
# cutadapt and bowtie2 take theirs from cutadapt: extra and bowtie2: extra
extra:
  bowtie2_build: ""
  fastqc: ""
  markduplicates: ""
  ataqv: ""
  featurecounts: ""
  multiqc: ""
  bamcoverage: ""
  bigwigaverage: ""
  computematrix: ""
  plotprofile: ""
