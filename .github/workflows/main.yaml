name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  Formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Formatting
        uses: super-linter/super-linter@v7
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_SNAKEMAKE_SNAKEFMT: true

  Linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint workflow
        uses: snakemake/snakemake-github-action@v2
        with:
          directory: .test/
          snakefile: workflow/Snakefile
          snakemake-version: "8.25.5"
          args: "--lint"

  Testing:
    runs-on: ubuntu-latest
    needs:
      - Linting
      - Formatting
    steps:
      - uses: actions/checkout@v4

      # Conda environments of the rules, reused until an env file changes.
      # Caches saved on main can be restored by all pull requests.
      - name: Cache conda environments
        uses: actions/cache@v4
        with:
          path: .test/.snakemake/conda
          key: conda-envs-${{ runner.os }}-${{ hashFiles('workflow/envs/*.yaml') }}

      # Pull requests run the full test. A push to main (a merged pull
      # request, already tested) only builds the conda environments, so
      # their cache is available to new pull requests.
      - name: Test workflow
        uses: snakemake/snakemake-github-action@v2
        with:
          directory: .test/
          snakefile: workflow/Snakefile
          snakemake-version: "8.25.5"
          args: >-
            ${{ github.event_name == 'pull_request'
            && '--sdm conda --show-failed-logs --cores 4 --conda-cleanup-pkgs cache --all-temp'
            || '--sdm conda --cores 4 --conda-create-envs-only' }}
