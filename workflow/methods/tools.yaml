# Workflow overrides of the snakemake-methods database.
#
# Versions of these tools are taken only from the environments that run them
# in this workflow (their packages are also in other environments, e.g.
# Python in all Python environments).
tools:
  samtools: {envs: [encode, te]}
  bedtools: {envs: [encode, gat]}
  python: {envs: [encode, qc, tss, te, gat]}
  numpy: {envs: [qc, tss, te]}
  scipy: {envs: [qc]}
  matplotlib: {envs: [qc, tss]}
  r: {envs: [r, deseq2, eulerr, integration]}
  # Versions of the DESeq2 plots; the integration plots have their own env
  ggplot2: {envs: [deseq2]}
  ggrepel: {envs: [deseq2]}
references:
  # Intersection-union test (checked on Crossref, 2026-11-18)
  berger1982:
    citation: Berger, 1982
    authors: [Berger RL]
    year: 1982
    title: "Multiparameter hypothesis testing and acceptance sampling"
    journal: Technometrics
    volume: 24
    pages: "295-300"
    doi: 10.1080/00401706.1982.10487790
  # The workflow follows this version of the ENCODE ATAC-seq pipeline
  encode2020:
    note: "ENCODE ATAC-seq pipeline v2.2.3: https://github.com/ENCODE-DCC/atac-seq-pipeline"
