$schema: "https://json-schema.org/draft/2020-12/schema"
description: entries for the sample sheet
properties:
  sample:
    type: string
    description: sample name; reads are read from reads/{sample}_R1_001.fastq.gz and reads/{sample}_R2_001.fastq.gz
  condition:
    type: string
    description: condition; samples of the same condition are treated as biological replicates
  reference:
    type: string
    enum: ["yes", "no"]
    description: yes for the samples of the reference (control) condition of the DESeq2 analysis

required:
  - sample
  - condition
