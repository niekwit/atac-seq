$schema: "https://json-schema.org/draft/2020-12/schema"
description: main configuration schema for the workflow
type: object
properties:
  genome:
    type: object
    properties:
      ensembl:
        type: string
        description: genome build (hg19, hg38, mm38, mm39, dm6 or test)
      release:
        type: integer
        description: Ensembl release
    required: ["ensembl", "release"]

  mito_chr_name:
    type: string

  cutadapt:
    type: object
    properties:
      adapter_r1:
        type: string
      adapter_r2:
        type: string
      extra:
        type: string
    required: ["adapter_r1", "adapter_r2", "extra"]

  bowtie2:
    type: object
    properties:
      multimapping:
        type: integer
        minimum: 0
      extra:
        type: string
    required: ["multimapping", "extra"]

  filter:
    type: object
    properties:
      mapq_thresh:
        type: integer
        minimum: 0
      filter_chrs:
        type: array
        items:
          type: string
    required: ["mapq_thresh", "filter_chrs"]

  subsample_reads:
    type: integer
    minimum: 0

  macs2:
    type: object
    properties:
      gsize:
        type: string
      pval_thresh:
        type: number
      smooth_win:
        type: integer
      cap_num_peak:
        type: integer
    required: ["gsize", "pval_thresh", "smooth_win", "cap_num_peak"]

  peaks:
    type: object
    properties:
      keep_chr_regex:
        type: string
      min_replicate_fraction:
        type: number
        exclusiveMinimum: 0
        maximum: 1
        default: 1
      min_overlap:
        type: number
        exclusiveMinimum: 0
        maximum: 1
        default: 0.5
      tss_region:
        type: integer
        minimum: 1
        default: 3000
    required: ["keep_chr_regex"]

  idr:
    type: object
    properties:
      enable:
        type: boolean
      threshold:
        type: number
    required: ["enable", "threshold"]

  pseudoreplication_random_seed:
    type: integer
    minimum: 0

  deseq2:
    type: object
    properties:
      enable:
        type: boolean
      peak_method:
        type: string
        enum: ["overlap", "idr"]
      pca_ntop:
        type: integer
        minimum: 2
      contrasts:
        type: array
        items:
          type: array
          items:
            type: string
          minItems: 2
          maxItems: 2
      fdr:
        type: number
        exclusiveMinimum: 0
        maximum: 1
      lfc_threshold:
        type: number
        minimum: 0
      min_count:
        type: integer
        minimum: 0
        default: 10

  te:
    type: object
    properties:
      enable:
        type: boolean
        default: false
      only:
        type: boolean
        default: false
      classes:
        type: array
        items:
          type: string
        default: []
      normalisation:
        type: string
        enum: ["deseq2", "insertions"]
        default: deseq2
      bigwig_bin_size:
        type: integer
        minimum: 1
        default: 10
      bigwig_normalisation:
        type: string
        enum: ["cpm", "deseq2"]
        default: cpm
      heatmap:
        type: object
        properties:
          classes:
            type: array
            items:
              type: string
            minItems: 1
            default: ["LINE", "SINE", "LTR", "DNA"]
          subfamilies:
            type: array
            items:
              type: string
            minItems: 1
            default: ["all"]
          max_per_class:
            type: integer
            minimum: 1
            default: 25
      profile:
        type: object
        properties:
          subfamilies:
            type: array
            items:
              type: string
            default: []
          min_consensus_fraction:
            type: number
            exclusiveMinimum: 0
            maximum: 1
            default: 0.9
          # Multiples of the bin size of computeMatrix (50 bp)
          flank:
            type: integer
            minimum: 0
            multipleOf: 50
            default: 2000
          body_length:
            type: integer
            minimum: 50
            multipleOf: 50
            default: 6000
      correlation:
        type: object
        properties:
          datasets:
            type: object
            additionalProperties:
              type: string
            default: {}
          gat_samples:
            type: integer
            minimum: 100
            default: 10000

  rnaseq:
    type: object
    properties:
      tables:
        type: [object, "null"]
        # A path, or a list of paths (e.g. genes and TEs in separate files)
        additionalProperties:
          type: [string, array]
          items:
            type: string
          minItems: 1
        default: {}
      columns:
        type: object
        properties:
          gene_id:
            type: [string, "null"]
            default: ""
          log2fc:
            type: string
            default: log2FoldChange
          padj:
            type: string
            default: padj
          base_mean:
            type: string
            default: baseMean
      id_type:
        type: string
        enum: ["auto", "ensembl", "symbol"]
        default: auto
      te_separator:
        type: string
        default: ":"
      fdr:
        type: number
        exclusiveMinimum: 0
        maximum: 1
        default: 0.05
      lfc_threshold:
        type: number
        minimum: 0
        default: 0
      distance_bins:
        type: array
        items:
          type: integer
          minimum: 1
        minItems: 1
        uniqueItems: true
        default: [1000, 10000, 50000, 100000]
      pair_lfc_threshold:
        type: number
        minimum: 0
        default: 1
      tss_profile_flank:
        type: integer
        minimum: 100
        default: 3000

  h3k9me3:
    type: object
    properties:
      contrasts:
        type: [object, "null"]
        additionalProperties:
          type: object
          properties:
            regions:
              type: string
            # No default: a DiffBind table read as BED would fail later
            diffbind:
              type: boolean
            direction:
              type: string
              enum: ["lost", "gained"]
              default: lost
            bigwigs:
              type: [object, "null"]
              properties:
                control:
                  type: string
                treatment:
                  type: string
              required: ["control", "treatment"]
              additionalProperties: false
          required: ["regions", "diffbind"]
          additionalProperties: false
        default: {}
      columns:
        type: object
        properties:
          chr:
            type: string
            default: seqnames
          start:
            type: string
            default: start
          end:
            type: string
            default: end
          log2fc:
            type: string
            default: Fold
          fdr:
            type: string
            default: FDR
      flip_fold:
        type: boolean
        default: false
      fdr:
        type: number
        exclusiveMinimum: 0
        maximum: 1
        default: 0.05
      profile_flank:
        type: integer
        minimum: 100
        default: 5000
      profile_body_length:
        type: integer
        minimum: 100
        default: 5000
      min_copies:
        type: integer
        minimum: 1
        default: 20

  extra:
    type: object
    properties:
      bowtie2_build:
        type: [string, "null"]
        default: ""
      fastqc:
        type: [string, "null"]
        default: ""
      markduplicates:
        type: [string, "null"]
        default: ""
      ataqv:
        type: [string, "null"]
        default: ""
      featurecounts:
        type: [string, "null"]
        default: ""
      multiqc:
        type: [string, "null"]
        default: ""
      bamcoverage:
        type: [string, "null"]
        default: ""
      bigwigaverage:
        type: [string, "null"]
        default: ""
      computematrix:
        type: [string, "null"]
        default: ""
      plotprofile:
        type: [string, "null"]
        default: ""
    additionalProperties: false

required:
  - genome
  - mito_chr_name
  - cutadapt
  - bowtie2
  - filter
  - subsample_reads
  - macs2
  - peaks
  - idr
  - pseudoreplication_random_seed
